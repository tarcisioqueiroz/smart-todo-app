name: Claude Code Review

# Revisão automática de PRs, no estilo CodeRabbit.
# Roda quando um PR é aberto, recebe novos commits, é reaberto ou sai de rascunho.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/package-lock.json"
      - "**/go.sum"
      - "mobile/assets/**"
      - "**/*.md"

# Se chegar um commit novo enquanto uma revisão ainda está rodando,
# cancela a anterior e revisa só a versão mais recente.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Não revisa rascunhos nem PRs vindos de forks (forks não recebem os secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Revisão com Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Autentica com a assinatura do Claude (token gerado com `claude setup-token`).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPOSITÓRIO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Você é o revisor de código deste repositório. Antes de começar, leia
            `.github/claude/REVIEW_GUIDELINES.md` e siga exatamente o formato e os
            critérios descritos lá. Escreva tudo em português do Brasil.

            Passos:
            1. Veja o contexto do PR com `gh pr view` e o diff com `gh pr diff`.
            2. Abra os arquivos alterados (e os que eles usam) para confirmar cada
               achado antes de comentar. Não comente o que não conseguiu verificar.
            3. Publique cada problema como comentário inline na linha exata, usando
               a ferramenta mcp__github_inline_comment__create_inline_comment.
            4. No fim, publique UM comentário geral no PR com `gh pr comment`,
               contendo o resumo, o walkthrough e o checklist final.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
